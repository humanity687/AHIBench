<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AHI-Multi v3.0 — Digital Life Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 移动端适配：Google Fonts 异步加载（media=print 技巧），弱网不阻塞首屏；display=swap 已在 -->
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Serif+SC:wght@400;500;600;700;900&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" onerror="this.remove()">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   AHI-Multi v3.0 — Digital Life Console
   Design: Bio-Digital Control Center
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* ── Void depths ── */
  --void-0: #03030c;
  --void-1: #060613;
  --void-2: #0a0a1c;
  --void-3: #0e0e24;
  --surface-1: #12122c;
  --surface-2: #181838;
  --surface-3: #1e1e44;
  /* ── Life signals ── */
  --signal-cyan: #00e6b8;
  --signal-cyan-dim: #00c898;
  --signal-blue: #5eb8ff;
  --signal-blue-dim: #3a90e0;
  --signal-rose: #ff8aaa;
  --signal-rose-dim: #e87090;
  --signal-amber: #ff9944;
  --signal-green: #2ee890;
  /* ── Alert ── */
  --alert-red: #ff4460;
  --alert-red-glow: rgba(255,68,96,0.15);
  /* ── Text ── */
  --text-body: #d8d4ec;
  --text-dim: #9494b8;
  --text-faint: #5c5c82;
  /* ── Borders ── */
  --border-subtle: rgba(255,255,255,0.04);
  --border-dim: rgba(255,255,255,0.07);
  --border-glow: rgba(0,230,184,0.12);
  --border-active: rgba(0,230,184,0.25);
  /* ── Radius ── */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 20px;
  /* ── Fonts ── */
  --font-display: 'Rajdhani', system-ui, sans-serif;
  --font-body: 'Crimson Pro', 'Noto Serif SC', serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  /* ── Easing ── */
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }

body {
  font-family: var(--font-body);
  background: var(--void-0);
  color: var(--text-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; /* 移动端适配：去掉点击灰闪 */
  font-weight: 500;
}

/* ── Ambient background layers ── */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 15% 15%, rgba(0,180,140,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 85% 80%, rgba(100,140,255,0.03) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(0,0,0,0) 0%, transparent 100%);
  animation: ambientShift 12s ease-in-out infinite;
}
@keyframes ambientShift {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 1; }
}

/* Subtle grid overlay */
body::after {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.5;
}

#app {
  position:relative; z-index:1;
  display:flex; width:100%;
  height:100vh;
  height:100dvh; /* 移动端适配：iOS Safari 动态视口，底栏不被浏览器工具栏/键盘遮挡 */
  backdrop-filter: blur(0px);
}

/* ═══════════════════ Login ═══════════════════ */
.login-screen {
  display:flex; align-items:center; justify-content:center;
  width:100%; height:100%; position:relative;
  /* 移动端适配：高度跟随 #app（100dvh/visualViewport），键盘弹出时不越界 */
}
.login-core {
  position:relative; z-index:2;
  width: 420px; padding: 56px 48px;
  background: var(--surface-1);
  border: 1px solid var(--border-dim);
  border-radius: var(--r-lg);
  text-align: center;
  animation: loginReveal 1s var(--ease-out-expo);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.02) inset,
    0 32px 96px rgba(0,0,0,0.6),
    0 0 120px rgba(0,230,184,0.03);
}
@keyframes loginReveal {
  from { opacity: 0; transform: translateY(32px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.login-core .sigil {
  width: 56px; height: 56px; margin: 0 auto 20px;
  border: 1px solid var(--border-active);
  border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  background: radial-gradient(circle at 30% 30%, rgba(0,230,184,0.1), transparent);
  animation: sigilBreathe 3s ease-in-out infinite;
}
@keyframes sigilBreathe {
  0%, 100% { box-shadow: 0 0 20px rgba(0,230,184,0.08); }
  50% { box-shadow: 0 0 40px rgba(0,230,184,0.18); }
}
.login-core .sigil span {
  font-family: var(--font-mono); font-size: 24px; color: var(--signal-cyan);
}

.login-core h1 {
  font-family: var(--font-display); font-size: 26px; font-weight: 700;
  color: var(--text-body); letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 4px;
}
.login-core .subtitle {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-faint);
  letter-spacing: 2px; text-transform: uppercase; margin-bottom: 32px;
  font-weight: 500;
}

.login-core .divider {
  width: 48px; height: 1px; margin: 0 auto 28px;
  background: linear-gradient(90deg, transparent, var(--signal-cyan), transparent);
  opacity: 0.5;
}

.login-core input {
  width: 100%; padding: 13px 20px;
  background: var(--void-1); border: 1px solid var(--border-dim);
  border-radius: var(--r-sm); color: var(--text-body);
  font-family: var(--font-mono); font-size: 14px; outline: none;
  text-align: center; letter-spacing: 0.5px;
  transition: all 0.35s var(--ease-smooth);
}
.login-core input:focus {
  border-color: var(--signal-cyan);
  box-shadow: 0 0 0 4px rgba(0,230,184,0.06), 0 0 32px rgba(0,230,184,0.04);
}
.login-core input::placeholder {
  color: var(--text-faint); font-family: var(--font-body); font-style: italic;
}

.login-core button {
  margin-top: 20px; width: 100%; padding: 13px;
  background: linear-gradient(135deg, var(--signal-cyan), #00b890);
  border: none; border-radius: var(--r-sm); color: #000;
  cursor: pointer; font-family: var(--font-display); font-size: 14px; font-weight: 700;
  letter-spacing: 3px; text-transform: uppercase;
  transition: all 0.3s var(--ease-smooth);
}
.login-core button:hover {
  transform: translateY(-1px);
  box-shadow: 0 12px 40px rgba(0,230,184,0.25);
}
.login-core button:active { transform: translateY(0); }

.login-core .hint {
  margin-top: 20px; font-size: 12px; color: var(--text-faint);
  font-style: italic;
}

/* ═══════════════════ Sidebar ═══════════════════ */
.sidebar {
  width: 264px; min-width: 264px;
  background: linear-gradient(180deg, var(--void-1) 0%, var(--void-2) 100%);
  border-right: 1px solid var(--border-subtle);
  display:flex; flex-direction:column;
  z-index: 10; transition: transform 0.4s var(--ease-out-expo);
  position:relative;
}
.sidebar::after {
  content: ''; position: absolute; right: -1px; top: 0; bottom: 0;
  width: 1px; background: linear-gradient(180deg, transparent, rgba(0,230,184,0.1), transparent);
  pointer-events: none;
}

.sidebar-header {
  padding: 24px 20px 18px;
  border-bottom: 1px solid var(--border-subtle);
  position: relative;
}
.sidebar-header h2 {
  font-family: var(--font-display); font-size: 18px; font-weight: 700;
  color: var(--signal-cyan); letter-spacing: 2px; text-transform: uppercase;
}
.sidebar-header .ver {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-faint);
  letter-spacing: 1px; margin-top: 2px;
}

.sidebar-nav { flex:1; overflow-y:auto; padding: 12px; -webkit-overflow-scrolling: touch; } /* 移动端适配：iOS 惯性滚动 */
.sidebar-nav::-webkit-scrollbar { width: 3px; }
.sidebar-nav::-webkit-scrollbar-track { background: transparent; }
.sidebar-nav::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 2px; }

.nav-section { margin-bottom: 18px; }
.nav-section-label {
  font-family: var(--font-display); font-size: 10px; font-weight: 700;
  color: var(--text-faint); text-transform: uppercase; letter-spacing: 2.5px;
  padding: 8px 10px 8px; opacity: 0.8;
}

.nav-item {
  display:flex; align-items:center; gap:10px;
  padding: 10px 12px; cursor:pointer; border-radius: var(--r-sm);
  font-family: var(--font-display); font-size: 13px; font-weight: 600;
  color: var(--text-dim); letter-spacing: 0.5px;
  transition: all 0.25s var(--ease-smooth); margin-bottom: 2px;
  position:relative; user-select:none;
}
.nav-item:hover {
  background: var(--surface-1); color: var(--text-body);
}
.nav-item.active {
  background: var(--surface-2);
  color: var(--signal-cyan);
}
.nav-item.active::before {
  content: ''; position:absolute; left:0; top:6px; bottom:6px;
  width: 2px; background: var(--signal-cyan); border-radius: 0 2px 2px 0;
  box-shadow: 0 0 8px rgba(0,230,184,0.4);
}

.nav-icon {
  font-size: 15px; width: 20px; text-align: center; flex-shrink: 0;
  opacity: 0.7;
}
.nav-item.active .nav-icon { opacity: 1; }

.nav-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  transition: all 0.3s;
}
.nav-dot.online { background: var(--signal-green); box-shadow: 0 0 8px rgba(46,232,144,0.5); animation: dotPulse 2.5s ease-in-out infinite; }
.nav-dot.offline { background: var(--text-faint); }
@keyframes dotPulse {
  0%, 100% { box-shadow: 0 0 6px rgba(46,232,144,0.4); }
  50% { box-shadow: 0 0 14px rgba(46,232,144,0.7); }
}

.nav-badge {
  margin-left: auto; font-family: var(--font-mono); font-size: 9px;
  background: var(--surface-1); padding: 2px 8px; border-radius: 10px;
  color: var(--text-faint); letter-spacing: 0.5px;
}
.nav-badge.live { background: rgba(46,232,144,0.1); color: var(--signal-green); }

.sidebar-footer {
  padding: 14px; border-top: 1px solid var(--border-subtle);
  display:flex; flex-direction:column; gap:10px;
}

.ws-indicator {
  display:flex; align-items:center; gap:8px;
  padding: 8px 12px; border-radius: var(--r-sm);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.5px;
  transition: all 0.3s;
}
.ws-indicator.live { background: rgba(46,232,144,0.06); color: var(--signal-green); border: 1px solid rgba(46,232,144,0.12); }
.ws-indicator.dead { background: rgba(255,68,96,0.06); color: var(--alert-red); border: 1px solid rgba(255,68,96,0.12); }
.ws-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.ws-indicator.live .ws-dot { background:var(--signal-green); animation: dotPulse 2s ease-in-out infinite; }
.ws-indicator.dead .ws-dot { background:var(--alert-red); }

.admin-badge {
  font-family: var(--font-mono); font-size: 9px; color: var(--signal-amber);
  text-align: center; padding: 5px 8px;
  border: 1px solid rgba(255,153,68,0.3); border-radius: var(--r-xs);
  letter-spacing: 1px; background: rgba(255,153,68,0.04);
}
.user-id-tag {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-faint);
  text-align: center; letter-spacing: 0.5px;
}

.emergency-btn {
  width: 100%; padding: 10px;
  border: 1px solid rgba(255,68,96,0.3);
  background: transparent; color: var(--alert-red);
  border-radius: var(--r-sm); cursor: pointer;
  font-family: var(--font-display); font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  transition: all 0.25s;
}
.emergency-btn:hover {
  background: var(--alert-red); color: #fff;
  box-shadow: 0 0 24px var(--alert-red-glow);
}

/* ═══════════════════ Main ═══════════════════ */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }

.header {
  display:flex; align-items:center; gap:14px;
  padding: 14px 24px;
  background: linear-gradient(180deg, rgba(10,10,28,0.95), rgba(6,6,19,0.9));
  border-bottom: 1px solid var(--border-subtle);
  backdrop-filter: blur(12px);
  min-height: 52px;
}
.header-title {
  font-family: var(--font-display); font-size: 15px; font-weight: 700;
  color: var(--text-body); letter-spacing: 1px; text-transform: uppercase;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; /* 移动端适配：窄屏标题不溢出 */
}
.header .sep {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-faint);
  margin: 0 4px;
}

/* hamburger */
.hamburger {
  display:none; background:none; border:none;
  color: var(--text-dim); font-size: 20px; cursor:pointer;
  padding: 6px 8px; line-height: 1; transition: color 0.2s;
  border-radius: var(--r-xs);
}
.hamburger:hover { color: var(--signal-cyan); }
.sidebar-overlay {
  display:none; position:fixed; inset:0; background:rgba(3,3,12,0.7);
  z-index: 9; backdrop-filter: blur(4px);
}

.content { flex:1; overflow-y:auto; overflow-x:hidden; position:relative; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; } /* 移动端适配：惯性滚动 + 防下拉刷新劫持 */
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 2px; }

/* ═══════════════════ Console ═══════════════════ */
.console-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:24px;
  max-width: 1200px;
}
@media (min-width: 900px) {
  .console-grid .panel:first-child { grid-column: span 1; }
  .console-grid .panel:nth-child(2) { grid-column: span 1; }
}

.panel {
  background: var(--surface-1);
  border: 1px solid var(--border-dim);
  border-radius: var(--r-md); padding: 22px;
  transition: border-color 0.4s, box-shadow 0.4s;
  position: relative; overflow: hidden;
}
.panel::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
  pointer-events: none;
}
.panel:hover { border-color: var(--border-glow); }
.panel h3 {
  font-family: var(--font-display); font-size: 12px; font-weight: 700;
  color: var(--signal-cyan); text-transform: uppercase; letter-spacing: 2px;
  margin-bottom: 18px; display:flex; align-items:center; gap:8px;
}
.panel h3::after {
  content: ''; flex:1; height: 1px;
  background: linear-gradient(90deg, rgba(0,230,184,0.2), transparent);
}

.agent-card {
  display:flex; align-items:center; gap:14px;
  padding: 14px 16px; background: var(--surface-2);
  border: 1px solid transparent; border-radius: var(--r-sm);
  margin-bottom: 8px; cursor:pointer;
  transition: all 0.3s var(--ease-smooth);
  position: relative; overflow: hidden;
}
.agent-card::after {
  content: ''; position:absolute; inset:0;
  background: radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.02), transparent);
  pointer-events: none;
}
.agent-card:hover {
  border-color: var(--border-glow);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  transform: translateY(-1px);
}
.agent-card .avatar {
  width: 40px; height: 40px; border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-mono); font-size: 18px; font-weight: 600;
  flex-shrink: 0; position: relative;
}
.agent-card .avatar.lin-shen {
  background: rgba(94,184,255,0.1); color: var(--signal-blue);
  box-shadow: 0 0 16px rgba(94,184,255,0.15);
}
.agent-card .avatar.mo-bai {
  background: rgba(255,138,170,0.1); color: var(--signal-rose);
  box-shadow: 0 0 16px rgba(255,138,170,0.15);
}
.agent-card .info { flex:1; min-width:0; }
.agent-card .name {
  font-family: var(--font-display); font-weight: 700; font-size: 15px;
  letter-spacing: 0.5px; color: var(--text-body);
}
.agent-card .desc {
  font-size: 12px; color: var(--text-faint); margin-top: 2px;
  font-style: italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.agent-card .stat {
  font-family: var(--font-mono); font-size: 9px; padding: 4px 10px;
  border-radius: 12px; letter-spacing: 1px;
  background: var(--surface-1); color: var(--text-faint);
}
.agent-card .stat.online {
  background: rgba(46,232,144,0.08);
  color: var(--signal-green);
}

/* log list */
.log-list {
  font-family: var(--font-mono); font-size: 10px; line-height: 1.7;
  max-height: 320px; overflow-y:auto; -webkit-overflow-scrolling: touch;
}
.log-list::-webkit-scrollbar { width: 3px; }
.log-list::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 2px; }

.log-entry {
  padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.015);
  color: var(--text-dim); white-space: nowrap; overflow:hidden; text-overflow:ellipsis;
  transition: background 0.2s;
}
.log-entry:hover { background: rgba(255,255,255,0.01); }
.log-entry .lvl { font-weight: 600; margin-right: 4px; }
.log-entry .lvl.INFO { color: var(--signal-cyan); }
.log-entry .lvl.WARN { color: var(--signal-amber); }
.log-entry .lvl.ERROR { color: var(--alert-red); }

/* ═══════════════════ Chat Area ═══════════════════ */
.chat-area { display:flex; flex-direction:column; height:100%; }

/* Loop bar */
.loop-bar {
  display:flex; align-items:center; gap:8px;
  padding: 10px 20px;
  background: linear-gradient(180deg, rgba(10,10,28,0.8), rgba(6,6,19,0.6));
  border-bottom: 1px solid var(--border-subtle);
  font-family: var(--font-mono); font-size: 10px; flex-wrap:wrap;
  color: var(--text-dim); backdrop-filter: blur(8px);
}
.loop-label {
  font-family: var(--font-display); font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-faint);
  margin-right: 4px;
}
.loop-status {
  padding: 3px 10px; border-radius: 10px; font-size: 9px; font-weight: 600;
  letter-spacing: 0.5px;
}
.loop-running { background: rgba(46,232,144,0.08); color: var(--signal-green); border: 1px solid rgba(46,232,144,0.15); }
.loop-paused { background: rgba(255,153,68,0.08); color: var(--signal-amber); border: 1px solid rgba(255,153,68,0.15); }
.loop-stopped { background: var(--surface-1); color: var(--text-faint); border: 1px solid var(--border-dim); }

.loop-bar .sep { color: var(--text-faint); margin: 0 2px; }

.btn-ctrl {
  padding: 5px 12px; border: none; border-radius: var(--r-sm);
  cursor:pointer; font-family: var(--font-display); font-size: 10px;
  font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  transition: all 0.25s var(--ease-smooth);
}
.btn-start { background: rgba(46,232,144,0.1); color: var(--signal-green); border: 1px solid rgba(46,232,144,0.2); }
.btn-start:hover { background: rgba(46,232,144,0.18); box-shadow: 0 0 16px rgba(46,232,144,0.1); }
.btn-pause { background: rgba(255,153,68,0.1); color: var(--signal-amber); border: 1px solid rgba(255,153,68,0.2); }
.btn-pause:hover { background: rgba(255,153,68,0.18); }
.btn-resume { background: rgba(46,232,144,0.1); color: var(--signal-green); border: 1px solid rgba(46,232,144,0.2); }
.btn-resume:hover { background: rgba(46,232,144,0.18); box-shadow: 0 0 16px rgba(46,232,144,0.1); }

.loop-bar input {
  width: 56px; padding: 4px 8px;
  background: var(--void-1); border: 1px solid var(--border-dim);
  border-radius: var(--r-xs); color: var(--text-body);
  font-family: var(--font-mono); font-size: 11px; text-align: center;
  transition: all 0.3s;
}
.loop-bar input:focus { border-color: var(--signal-cyan); outline: none; box-shadow: 0 0 8px rgba(0,230,184,0.08); }

.btn-set {
  background: transparent; color: var(--signal-cyan);
  border: 1px solid rgba(0,230,184,0.2);
  padding: 5px 12px; border-radius: var(--r-sm);
  cursor:pointer; font-family: var(--font-display); font-size: 10px;
  font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  transition: all 0.25s var(--ease-smooth);
}
.btn-set:hover { background: rgba(0,230,184,0.06); }

.btn-clear {
  margin-left: auto; background: transparent;
  color: var(--text-faint); border: 1px solid var(--border-dim);
  padding: 5px 12px; border-radius: var(--r-sm);
  cursor:pointer; font-family: var(--font-display); font-size: 10px;
  font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  transition: all 0.25s var(--ease-smooth);
}
.btn-clear:hover {
  color: var(--alert-red); border-color: rgba(255,68,96,0.3);
  background: rgba(255,68,96,0.04);
}

/* Shell log toggle */
.shell-log-toggle {
  padding: 10px 20px; background: var(--surface-1);
  border-bottom: 1px solid var(--border-dim); cursor: pointer;
  font-family: var(--font-mono); font-size: 10px; color: var(--signal-cyan);
  font-weight: 600; user-select: none; display:flex; align-items:center; gap:8px;
  transition: all 0.3s; letter-spacing: 0.5px;
}
.shell-log-toggle:hover { background: var(--surface-2); }
.shell-log-toggle .arrow {
  display:inline-block; transition: transform 0.35s var(--ease-out-expo);
  font-size: 8px;
}
.shell-log-toggle .arrow.open { transform: rotate(90deg); }

.shell-log-area {
  max-height: 200px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: rgba(2,2,10,0.8); border-bottom: 1px solid var(--border-dim);
  font-family: var(--font-mono); font-size: 9px;
}
.shell-log-area::-webkit-scrollbar { width: 3px; }
.shell-log-area::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 2px; }

.shell-entry {
  padding: 5px 20px; border-bottom: 1px solid rgba(255,255,255,0.015);
  display:flex; gap:12px; align-items:flex-start; line-height: 1.5;
  transition: background 0.2s;
}
.shell-entry:hover { background: rgba(255,255,255,0.01); }
.shell-entry .shell-time { color: var(--text-faint); white-space:nowrap; min-width:56px; font-size: 9px; }
.shell-entry .shell-cmd { color: var(--signal-amber); word-break:break-all; }
.shell-entry .shell-out { color: var(--signal-green); word-break:break-all; white-space:pre-wrap; }
.shell-entry .shell-err { color: var(--alert-red); word-break:break-all; white-space:pre-wrap; }
.shell-entry.error { border-left: 2px solid var(--alert-red); }
.shell-entry.ok { border-left: 2px solid var(--signal-green); }
.shell-entry.timeout { border-left: 2px solid var(--signal-amber); }

/* Messages */
.messages {
  flex:1; overflow-y:auto; padding: 20px 24px;
  display:flex; flex-direction:column; gap:8px;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain; /* 移动端适配 */
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 2px; }

.msg {
  max-width: 78%; animation: msgSlideIn 0.4s var(--ease-out-expo);
  display:flex; flex-direction:column;
}
.msg.agent { align-self:flex-start; }
.msg.user { align-self:flex-end; }
.msg.system { align-self:center; max-width:88%; }

@keyframes msgSlideIn {
  from { opacity: 0; transform: translateY(14px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.msg-source {
  font-family: var(--font-mono); font-size: 9px; margin-bottom: 5px;
  padding: 0 8px; letter-spacing: 0.5px;
}
.msg.agent .msg-source { color: var(--signal-blue); }
.msg.user .msg-source { color: var(--signal-amber); text-align:right; }
.msg.system .msg-source { color: var(--text-faint); text-align:center; }

.msg-body {
  padding: 12px 18px; border-radius: 14px; line-height: 1.65;
  font-family: var(--font-body); font-size: 15px; font-weight: 500;
  overflow-x:auto; position:relative;
}
.msg.agent .msg-body {
  background: var(--surface-2);
  border: 1px solid var(--border-dim);
  border-bottom-left-radius: 4px;
}
.msg.user .msg-body {
  background: linear-gradient(135deg, rgba(20,30,44,0.8), rgba(20,28,44,0.6));
  border: 1px solid rgba(30,50,70,0.5);
  border-bottom-right-radius: 4px;
}
.msg.system .msg-body {
  background: rgba(46,232,144,0.03); border: 1px solid rgba(46,232,144,0.08);
  font-family: var(--font-mono); font-size: 10px; text-align: center;
}

/* Markdown */
.msg-body p { margin:0 0 6px; }
.msg-body p:last-child { margin-bottom:0; }
.msg-body code {
  background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 3px;
  font-family: var(--font-mono); font-size: 0.84em;
}
.msg-body pre {
  background: rgba(2,2,10,0.7); padding: 14px 18px; border-radius: var(--r-sm);
  overflow-x:auto; margin:8px 0; font-size:0.8em;
  border: 1px solid var(--border-dim);
}
.msg-body pre code { background:none; padding:0; }
.msg-body ul, .msg-body ol { margin:4px 0; padding-left:20px; }
.msg-body blockquote {
  border-left: 3px solid var(--signal-cyan); margin:6px 0;
  padding:4px 14px; color: var(--text-dim); font-style: italic;
}
.msg-body a { color: var(--signal-cyan); text-underline-offset: 2px; }
.msg-body strong { color: var(--text-body); font-weight: 700; }

/* Input */
.input-area {
  display:flex; padding: 14px 20px; gap:10px;
  background: linear-gradient(0deg, var(--void-2), var(--void-1));
  border-top: 1px solid var(--border-dim);
}
.input-area textarea {
  flex:1; padding: 11px 16px;
  background: var(--void-0); border: 1px solid var(--border-dim);
  border-radius: var(--r-sm); color: var(--text-body);
  font-family: var(--font-body); font-size: 14px; outline: none;
  resize: none; height: 46px; line-height: 1.5;
  transition: all 0.35s var(--ease-smooth);
}
.input-area textarea:focus {
  border-color: var(--signal-cyan);
  box-shadow: 0 0 0 4px rgba(0,230,184,0.04), 0 0 24px rgba(0,230,184,0.03);
}
.input-area textarea::placeholder {
  color: var(--text-faint); font-style: italic;
}

.input-area button {
  padding: 11px 24px;
  background: linear-gradient(135deg, var(--signal-cyan), #00a878);
  border: none; border-radius: var(--r-sm); color: #000;
  cursor: pointer; font-family: var(--font-display); font-size: 13px;
  font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  align-self: flex-end; white-space: nowrap;
  transition: all 0.3s var(--ease-smooth);
}
.input-area button:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 32px rgba(0,230,184,0.22);
}
.input-area button:active { transform: translateY(0); }

/* Load more */
.load-more-btn {
  display:block; margin: 10px auto; padding: 7px 24px;
  background: transparent; border: 1px solid var(--border-dim);
  border-radius: 20px; color: var(--text-faint);
  cursor: pointer; font-family: var(--font-display); font-size: 10px;
  font-weight: 700; letter-spacing: 1px;
  transition: all 0.3s;
}
.load-more-btn:hover {
  border-color: rgba(0,230,184,0.3); color: var(--signal-cyan);
  box-shadow: 0 0 16px rgba(0,230,184,0.04);
}

/* Agents page */
.agents-grid {
  display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px; padding: 24px;
}

/* Empty state */
.empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding: 60px 20px; text-align: center;
}
.empty-state .icon {
  font-size: 36px; margin-bottom: 16px; opacity: 0.4;
}
.empty-state .text {
  color: var(--text-faint); font-style: italic; font-size: 14px;
}

/* ═══════════════════ Mobile ═══════════════════ */
@media (max-width: 768px) {
  .hamburger { display:block; }
  .sidebar-overlay.show { display:block; }
  .sidebar {
    position:fixed; left:-280px; top:0; bottom:0; z-index:10; width:280px;
    transition: left 0.4s var(--ease-out-expo);
  }
  .sidebar.open { left:0; box-shadow: 12px 0 60px rgba(0,0,0,0.8); }

  .header { padding: 12px 16px; }

  .console-grid { grid-template-columns:1fr; padding:14px; gap:12px; }
  .agents-grid { grid-template-columns:1fr; padding:14px; }

  .msg { max-width:92%; }
  .messages { padding: 14px 16px; }

  .input-area { padding: 10px 14px; gap:8px; }
  .input-area textarea { font-size: 16px; height: 48px; }
  .input-area button { padding: 10px 18px; font-size: 12px; }

  .loop-bar { gap: 5px; padding: 8px 14px; }
  .loop-bar input { width: 48px; }

  .shell-entry { padding: 4px 14px; font-size: 9px; }
  .shell-entry .shell-time { min-width: 48px; }

  .agent-card { padding: 12px 14px; }
  .nav-item { padding: 12px 14px; font-size: 14px; }
  .emergency-btn { padding: 12px; font-size: 12px; }
  .panel { padding: 14px; }

  .login-core { width: calc(100vw - 32px); padding: 40px 28px; }
  .login-core h1 { font-size: 22px; }

  /* ── 移动端触控目标（最小可点区域 ≥44px）与刘海屏安全区 ── */
  .hamburger { min-width:44px; min-height:44px; }
  .btn-ctrl, .btn-set, .btn-clear { min-height:44px; padding:9px 14px; }
  .load-more-btn { min-height:44px; padding:10px 24px; }
  .shell-log-toggle { min-height:44px; padding:12px 16px; }
  .input-area button { min-height:44px; }
  .input-area { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  .sidebar-footer { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
}

/* ═══════════════════ Animations ═══════════════════ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ═══════════════ Login ═══════════════ -->
  <div class="login-screen" v-if="!loggedIn">
    <div class="login-core">
      <div class="sigil"><span>&#9670;</span></div>
      <h1>AHI-Multi</h1>
      <div class="subtitle">Digital Life Support System v3.0</div>
      <div class="divider"></div>
      <input v-model="loginName" @keyup.enter="doLogin"
             placeholder="输入你的名字" maxlength="20" autofocus
             autocapitalize="off" autocorrect="off" autocomplete="off" enterkeyhint="done">
      <button type="button" @click="doLogin">进入系统</button>
      <div class="hint">你的名字将作为身份标识发送给数字生命</div>
    </div>
  </div>

  <!-- ═══════════════ Main Layout ═══════════════ -->
  <template v-if="loggedIn">
  <div class="sidebar-overlay" :class="{show:sidebarOpen}" @click="sidebarOpen=false"></div>

  <!-- Sidebar -->
  <div class="sidebar" :class="{open:sidebarOpen}">
    <div class="sidebar-header">
      <h2>AHI-Multi</h2>
      <div class="ver">Digital Life Console v3.0</div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-label">控制中心</div>
        <div class="nav-item" :class="{active:page==='console'}" @click="navTo('console')">
          <span class="nav-icon">&#9681;</span> Console
        </div>
        <div class="nav-item" :class="{active:page==='chat'}" @click="navTo('chat')">
          <span class="nav-icon">&#9671;</span> All Agents
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-section-label">数字生命</div>
        <div v-for="a in agents" :key="a.agent_id"
             class="nav-item" :class="{active:page==='chat/'+a.agent_id}"
             @click="navToChat(a.agent_id)">
          <span class="nav-dot" :class="isOnline(a.agent_id)?'online':'offline'"></span>
          <span>{{ a.agent_name || a.agent_id }}</span>
          <span class="nav-badge" :class="{live: isOnline(a.agent_id)}">
            {{ isOnline(a.agent_id) ? 'LIVE' : 'OFF' }}
          </span>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="ws-indicator" :class="wsConnected?'live':'dead'">
        <span class="ws-dot"></span>
        {{ wsConnected ? 'Connected' : 'Disconnected' }}
      </div>
      <div class="admin-badge" v-if="isAdmin">&#9670; ADMIN</div>
      <div class="user-id-tag">{{ myUserId }}</div>
      <button class="emergency-btn" type="button" @click="emergencyStop">Emergency Stop</button>
      <button class="emergency-btn" type="button" @click="doLogout" style="margin-top:6px;opacity:.85;">退出登录</button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="header">
      <button class="hamburger" type="button" @click="sidebarOpen=!sidebarOpen">&#9776;</button>
      <span class="header-title">{{ headerTitle }}</span>
    </div>

    <!-- ═══════════════ Console Page ═══════════════ -->
    <div class="content" v-if="page==='console'">
      <div class="console-grid">
        <!-- Digital Lives -->
        <div class="panel">
          <h3>Digital Lives</h3>
          <div v-if="agents.length===0" class="empty-state">
            <div class="icon">&#9671;</div>
            <div class="text">No agents registered</div>
          </div>
          <div v-for="a in agents" :key="a.agent_id" class="agent-card" @click="openChat(a.agent_id)">
            <div class="avatar" :class="a.agent_id">{{ (a.agent_name||a.agent_id).charAt(0) }}</div>
            <div class="info">
              <div class="name">{{ a.agent_name || a.agent_id }}</div>
              <div class="desc">{{ a.description || a.agent_type || 'Digital Life' }}</div>
            </div>
            <div class="stat" :class="isOnline(a.agent_id)?'online':''">
              {{ isOnline(a.agent_id) ? 'ONLINE' : 'OFFLINE' }}
            </div>
          </div>
        </div>

        <!-- System Logs -->
        <div class="panel">
          <h3>System Logs</h3>
          <div class="log-list">
            <div v-for="log in logs.slice(0,50)" :key="log.log_id" class="log-entry">
              <span class="lvl" :class="log.level">{{ log.level }}</span>
              {{ log.timestamp?.substring(0,19) || '' }} {{ log.source }}: {{ log.message?.substring(0,120) }}
            </div>
            <div v-if="!logs.length" style="color:var(--text-faint);font-style:italic;padding:12px;">— 暂无日志 —</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══════════════ All Agents Page ═══════════════ -->
    <div class="content" v-else-if="page==='chat'">
      <div style="padding:24px;">
        <h3 style="font-family:var(--font-display);font-size:12px;font-weight:600;color:var(--signal-cyan);text-transform:uppercase;letter-spacing:2px;margin-bottom:18px;display:flex;align-items:center;gap:8px;">
          All Agents
          <span style="flex:1;height:1px;background:linear-gradient(90deg,rgba(0,230,184,0.2),transparent);"></span>
        </h3>
        <div class="agents-grid">
          <div v-for="a in agents" :key="a.agent_id" class="agent-card" @click="openChat(a.agent_id)">
            <div class="avatar" :class="a.agent_id">{{ (a.agent_name||a.agent_id).charAt(0) }}</div>
            <div class="info">
              <div class="name">{{ a.agent_name || a.agent_id }}</div>
              <div class="desc">{{ a.description || a.agent_type }}</div>
            </div>
            <div class="stat" :class="isOnline(a.agent_id)?'online':''">
              {{ isOnline(a.agent_id) ? 'ONLINE' : 'OFFLINE' }}
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══════════════ Agent Chat Page ═══════════════ -->
    <div class="content chat-area" v-else-if="currentChat">
      <!-- Loop Control Bar -->
      <div class="loop-bar" v-if="currentChat">
        <span class="loop-label">Loop</span>
        <span class="loop-status" :class="loopStatusClass">{{ loopStatusText }}</span>
        <span class="sep">·</span>
        <span style="font-size:10px;">{{ loopInterval }}s</span>
        <button class="btn-ctrl btn-start" @click="loopStart" v-if="!loopRunning">Start</button>
        <button class="btn-ctrl btn-pause" @click="loopPause" v-if="loopRunning && !loopPaused">Pause</button>
        <button class="btn-ctrl btn-resume" @click="loopResume" v-if="loopPaused">Resume</button>
        <input type="number" v-model.number="loopIntervalInput" min="5" max="3600" placeholder="s">
        <button class="btn-set" @click="loopSetInterval">Set</button>
        <button class="btn-clear" @click="clearChat" title="清除当前聊天记录">Clear</button>
      </div>

      <!-- Shell Log Toggle (admin only) -->
      <div class="shell-log-toggle" @click="showShellLog=!showShellLog" v-if="currentChat && isAdmin">
        <span class="arrow" :class="{open:showShellLog}">&#9654;</span>
        Shell Log <span style="color:var(--text-faint);">({{ shellLogs.length }})</span>
        <span style="margin-left:auto;font-size:9px;color:var(--text-faint);" @click.stop="shellLogs=[]">clear</span>
      </div>

      <!-- Shell Log Area -->
      <div class="shell-log-area" v-if="showShellLog && currentChat && isAdmin">
        <button class="load-more-btn" v-if="shellHasMore" @click="loadMoreShell">Load more shell logs...</button>
        <div v-for="s in shellLogs.slice(-50).reverse()" :key="s._id"
             class="shell-entry" :class="s._status==='error'?'error':s._status==='timeout'?'timeout':'ok'">
          <span class="shell-time">{{ s._time }}</span>
          <div style="flex:1;display:flex;flex-direction:column;gap:1px;">
            <span class="shell-cmd" v-if="s._cmd">&gt; {{ s._cmd?.substring(0,120) }}</span>
            <span class="shell-out" v-if="s._out">{{ s._out?.substring(0,300) }}</span>
            <span class="shell-err" v-if="s._err">{{ s._err?.substring(0,300) }}</span>
          </div>
        </div>
        <div v-if="!shellLogs.length" class="empty-state" style="padding:20px;">
          <div class="text">— 暂无 Shell 执行记录 —</div>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages" ref="msgContainer">
        <button class="load-more-btn" v-if="chatHasMore" @click="loadMoreChat">Load earlier messages...</button>
        <div v-for="m in chatMessages" :key="m._id" class="msg" :class="m._cls">
          <div class="msg-source" v-if="m._source">{{ m._source }} <span style="opacity:0.5;font-size:8px;" v-if="m._to">→ {{ m._to }}</span></div>
          <div class="msg-body" v-html="renderMarkdown(m._text)"></div>
        </div>
        <div v-if="!chatMessages.length && !chatHasMore"
             class="empty-state">
          <div class="icon">&#9671;</div>
          <div class="text">开始对话...</div>
        </div>
      </div>

      <!-- Input -->
      <div class="input-area">
        <textarea v-model="inputMsg"
                  @keydown.enter.exact.prevent="sendMsg"
                  placeholder="输入消息... Enter 发送 / Shift+Enter 换行"
                  rows="1"
                  autocapitalize="sentences" autocorrect="on" autocomplete="off"
                  enterkeyhint="send"></textarea>
        <button type="button" @click="sendMsg">Send</button>
      </div>
    </div>
  </div>
  </template>
</div>

<script>
(() => {
// 移动端适配：Vue CDN 加载失败降级提示（弱网不白屏）；marked 缺失时 renderMarkdown 已有纯文本兜底
if (typeof Vue === 'undefined') {
  document.getElementById('app').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100dvh;padding:24px;text-align:center;font-family:sans-serif;font-size:14px;color:#ff8aaa;">核心库加载失败（Vue CDN 不可达），请检查网络后刷新。</div>';
  return;
}
const { createApp, ref, computed, watch, nextTick, onMounted, onUnmounted } = Vue;

createApp({
  setup() {
    const loggedIn = ref(false);
    const loginName = ref('');
    const myUserId = ref('');
    const page = ref('console');
    const currentChat = ref(null);
    const inputMsg = ref('');
    const wsConnected = ref(false);
    const agents = ref([]);
    const onlineAgents = ref([]);
    const logs = ref([]);
    const chatMessages = ref([]);
    const shellLogs = ref([]);
    const showShellLog = ref(false);
    const msgContainer = ref(null);
    const sidebarOpen = ref(false);
    const loopRunning = ref(false);
    const loopPaused = ref(false);
    const loopInterval = ref(10);
    const loopIntervalInput = ref(10);
    const chatOffset = ref(0);
    const chatHasMore = ref(true);
    const shellOffset = ref(0);
    const shellHasMore = ref(true);
    const CHAT_PAGE = 10;
    const SHELL_PAGE = 10;

    const isAdmin = computed(() => {
      // 管理员白名单（实验配置）：0xbf5d36 = 平台管理员；human = 实验观察者（可看全部对话/私密标注）
      const ADMIN_IDS = ['0xbf5d36', 'human'];
      return ADMIN_IDS.includes(loginName.value.trim());
    });

    let ws = null;
    let reconnectTimer = null;
    let reconnectDelay = 1000;
    let refreshAgentsTimer = null;
    let refreshLogsTimer = null;
    let lastWsMsgAt = 0; // 移动端重连：最后收包时间，用于僵尸连接检测

    const loopStatusClass = computed(() => {
      if (!loopRunning.value) return 'loop-stopped';
      return loopPaused.value ? 'loop-paused' : 'loop-running';
    });
    const loopStatusText = computed(() => {
      if (!loopRunning.value) return 'Stopped';
      return loopPaused.value ? 'Paused' : 'Running';
    });
    const headerTitle = computed(() => {
      if (page.value.startsWith('chat/')) {
        const aid = currentChat.value || '';
        const ag = agents.value.find(a => a.agent_id === aid);
        return ag ? (ag.agent_name || ag.agent_id) : aid;
      }
      if (page.value === 'console') return 'Console';
      if (page.value === 'chat') return 'All Agents';
      return 'AHI-Multi v3.0';
    });
    const isOnline = (id) => onlineAgents.value.some(a => a.agent_id === id);

    function renderMarkdown(text) {
      if (!text) return '';
      try {
        if (typeof marked !== 'undefined') {
          marked.setOptions({ breaks: true, gfm: true });
          return marked.parse(text);
        }
      } catch(e) {}
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }

    function resolveName(id) {
      if (!id) return '';
      const found = agents.value.find(x => x.agent_id === id || 'agent:'+x.agent_id === id);
      if (found) return found.agent_name || found.agent_id;
      if (id.startsWith('user:')) return id.slice(5);
      if (id.startsWith('agent:')) return id.slice(6);
      return id;
    }

    function doLogin() {
      const name = loginName.value.trim();
      if (!name) return;
      myUserId.value = 'user:' + name;
      loggedIn.value = true;
      sessionStorage.setItem('ahi_login_name', name);
      connectWs();
      refreshAgents();
      refreshLogs();
      if (!refreshAgentsTimer) refreshAgentsTimer = setInterval(refreshAgents, 5000);
      if (!refreshLogsTimer) refreshLogsTimer = setInterval(refreshLogs, 10000);
    }

    function doLogout() {
      sessionStorage.removeItem('ahi_login_name');
      sessionStorage.removeItem('ahi_current_chat');
      if (refreshAgentsTimer) clearInterval(refreshAgentsTimer);
      if (refreshLogsTimer) clearInterval(refreshLogsTimer);
      if (ws) { try { ws.close(); } catch(e) {} }
      loggedIn.value = false;
      loginName.value = '';
      myUserId.value = '';
      currentChat.value = null;
      page.value = 'console';
    }

    function connectWs() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return; // 移动端重连防重入
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}/ws`);
      ws.onopen = () => {
        wsConnected.value = true;
        reconnectDelay = 1000;
        ws.send(JSON.stringify({type:'auth',payload:{user_id:myUserId.value}}));
        // 重新订阅当前聊天 channel（带 agent: 前缀与后端一致）
        if (currentChat.value) {
          ws.send(JSON.stringify({type:'subscribe',payload:{channel:'chat:agent:'+currentChat.value}}));
        }
      };
      ws.onmessage = (e) => {
        try {
          lastWsMsgAt = Date.now(); // 移动端重连：记录最后收包时间
          const msg = JSON.parse(e.data);
          const ch = msg.channel || '';

          // System channel events
          if (ch === 'system') {
            if (msg.type === 'agent_online' || msg.type === 'agent_offline') {
              refreshAgents();
            }
            if (msg.type === 'system_notification' || msg.type === 'log') {
              const pl = msg.payload || {};
              const text = pl.content || pl.message || JSON.stringify(pl);
              const level = pl.level || 'INFO';
              logs.value.unshift({
                log_id: msg.msg_id || Date.now(),
                timestamp: new Date().toLocaleTimeString(),
                level: level,
                source: pl.source || 'system',
                message: text,
              });
              if (logs.value.length > 200) logs.value.length = 200;
            }
          }
          // Chat channels: "chat:agent:xxx" / "chat:user:xxx"
          if (ch.startsWith('chat:')) {
            const payload = msg.payload || {};
            const content = payload.content || JSON.stringify(payload);
            const msgType = msg.type || payload.type || '';

            // Shell log diversion — admin only, only for current agent
            if (msgType === 'shell_result') {
              if (!isAdmin.value) return;
              const expectCh = 'chat:agent:' + currentChat.value;
              if (!currentChat.value || ch !== expectCh) return;
              const mid = msg.msg_id || '';
              if (!mid || !shellLogs.value.some(s => s._id === mid)) {
                shellLogs.value.push({
                  _id: mid || Date.now(),
                  _time: new Date().toLocaleTimeString(),
                  _cmd: payload.command || '',
                  _out: payload.status === 'completed' ? content : '',
                  _err: payload.error || (payload.status === 'error' ? content : ''),
                  _status: payload.status || 'completed',
                });
              }
              return;
            }

            // Deduplicate
            const mid = msg.msg_id || '';
            if (!mid || chatMessages.value.some(m => m._id === mid)) return;

            const fromId = payload.from_agent || payload.source || '';
            const msgTo = payload.to || '';
            const isPrivate = payload.private === true;

            // 决策 B3：私密消息——仅管理员可见（标注 [私密]）
            if (isPrivate) {
              if (!isAdmin.value) return;
              chatMessages.value.push({
                _id: mid || Date.now(),
                _cls: 'agent',
                _text: '[私密] ' + content,
                _source: resolveName(fromId),
                _to: '私密存档',
                _raw: fromId + ' → 私密',
                _private: true,
              });
              scrollDown();
              return;
            }

            // Non-admin: only show messages from current agent → user/broadcast
            if (!isAdmin.value) {
              if (!currentChat.value) return;
              if (fromId !== 'agent:' + currentChat.value) return;
              if (!msgTo || (msgTo !== 'broadcast:users' && !msgTo.startsWith('user:'))) return;
            }

            const isFromAgent = fromId.startsWith('agent:') ||
              agents.value.some(a => a.agent_id === fromId);
            chatMessages.value.push({
              _id: mid || Date.now(),
              _cls: isFromAgent ? 'agent' : 'user',
              _text: content,
              _source: resolveName(fromId),
              _to: resolveName(msgTo),
              _raw: fromId + ' → ' + msgTo,
            });
            scrollDown();
          }
        } catch(err) { console.error('WS onmessage error:', err); }
      };
      ws.onclose = () => { wsConnected.value = false; scheduleReconnect(); };
      ws.onerror = () => { ws.close(); };
    }

    function scheduleReconnect() {
      clearTimeout(reconnectTimer);
      if (document.visibilityState === 'hidden') return; // 后台不重连，回前台统一恢复
      reconnectTimer = setTimeout(() => {
        reconnectDelay = Math.min(reconnectDelay * 2, 30000); // 指数退避，上限 30s
        connectWs();
      }, reconnectDelay);
    }

    // 移动端省电：页面隐藏暂停轮询，回前台恢复
    function setPolling(paused) {
      if (paused) {
        if (refreshAgentsTimer) { clearInterval(refreshAgentsTimer); refreshAgentsTimer = null; }
        if (refreshLogsTimer) { clearInterval(refreshLogsTimer); refreshLogsTimer = null; }
      } else if (loggedIn.value) {
        if (!refreshAgentsTimer) refreshAgentsTimer = setInterval(refreshAgents, 5000);
        if (!refreshLogsTimer) refreshLogsTimer = setInterval(refreshLogs, 10000);
        refreshAgents();
        refreshLogs();
      }
    }

    // 移动端韧性：回前台/网络恢复 → 主动检测断线并立即重连（iOS 锁屏/切网后 onclose 常不触发，socket 僵死）
    function onVisibilityChange() {
      setPolling(document.visibilityState !== 'visible');
      if (document.visibilityState !== 'visible' || !loggedIn.value) return;
      reconnectDelay = 1000;
      clearTimeout(reconnectTimer);
      if (ws && ws.readyState === WebSocket.OPEN) {
        if (lastWsMsgAt && Date.now() - lastWsMsgAt > 60000) {
          try { ws.close(); } catch(e) {} // 疑似僵尸连接（>60s 无消息），主动断开触发 onclose → 重连
        }
      } else if (!ws || ws.readyState === WebSocket.CLOSED) {
        connectWs();
      }
    }
    document.addEventListener('visibilitychange', onVisibilityChange);
    window.addEventListener('online', onVisibilityChange);

    // 移动端键盘遮挡：visualViewport 高度实时写入 #app，键盘弹出时输入框保持可见（兼容旧 iOS 无 100dvh）
    function adjustLayoutHeight() {
      const app = document.getElementById('app');
      const vv = window.visualViewport;
      if (!app || !vv) return;
      if (vv.height < window.innerHeight - 1) app.style.height = vv.height + 'px';
      else app.style.height = '';
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', adjustLayoutHeight);
      window.visualViewport.addEventListener('scroll', adjustLayoutHeight);
    }
    adjustLayoutHeight();

    function scrollDown() {
      nextTick(() => {
        const el = msgContainer.value;
        if (el) el.scrollTop = el.scrollHeight;
      });
    }

    async function refreshAgents() {
      try {
        const [r1, r2] = await Promise.all([
          fetch('/api/v1/agents'),
          fetch('/api/v1/agents/online'),
        ]);
        if (r1.ok) { const d = await r1.json(); agents.value = d.data || []; }
        if (r2.ok) { const d = await r2.json(); onlineAgents.value = d.data || []; }
      } catch(e) {}
    }

    async function refreshLogs() {
      try {
        const r = await fetch('/api/v1/logs?limit=50');
        if (r.ok) { const d = await r.json(); logs.value = d.data || []; }
      } catch(e) {}
    }

    function navTo(p) { page.value = p; sidebarOpen.value = false; }
    function navToChat(id) { openChat(id); sidebarOpen.value = false; }

    function openChat(agentId) {
      const prevChat = currentChat.value;
      currentChat.value = agentId;
      page.value = 'chat/' + agentId;
      sessionStorage.setItem('ahi_current_chat', agentId);
      chatMessages.value = [];
      shellLogs.value = [];
      chatOffset.value = 0;
      chatHasMore.value = true;
      shellOffset.value = 0;
      shellHasMore.value = true;
      showShellLog.value = false;
      loopIntervalInput.value = loopInterval.value;
      // 订阅切换：先取消旧频道订阅（防订阅累积 → 多 agent 消息混入当前窗口），再订阅新频道
      if (ws && ws.readyState === 1) {
        if (prevChat && prevChat !== agentId) {
          ws.send(JSON.stringify({type:'unsubscribe',payload:{channel:'chat:agent:'+prevChat}}));
        }
        ws.send(JSON.stringify({type:'subscribe',payload:{channel:'chat:agent:'+agentId}}));
      }
      loadMoreChat();
      loadMoreShell();
      fetchLoopState();
    }

    function loadMoreChat() {
      if (!currentChat.value || !chatHasMore.value) return;
      const agentId = currentChat.value;
      fetch('/api/v1/messages?agent_id='+agentId+'&limit='+CHAT_PAGE+'&offset='+chatOffset.value)
        .then(r => r.json()).then(d => {
          const items = d.data || [];
          const reversed = items.slice().reverse();
          const existingIds = {};
          chatMessages.value.forEach(m => { existingIds[m._id] = true; });
          const newMsgs = [];
          reversed.forEach(m => {
            if (m.msg_type !== 'shell_result' && !existingIds[m.msg_id]) {
              // Non-admin: only show messages between current agent & current user
              if (!isAdmin.value) {
                const fromMatch = m.from_agent === 'agent:' + agentId || m.from_agent === agentId;
                const toUser = m.to_target === myUserId.value || m.to_target === 'broadcast:users';
                const fromUser = m.from_agent === myUserId.value;
                const toAgent = m.to_target === 'agent:' + agentId || m.to_target === agentId;
                if (!((fromMatch && toUser) || (fromUser && toAgent))) return;
              }
              const isAgent = m.from_agent === agentId || m.from_agent === 'agent:'+agentId;
              newMsgs.push({
                _id: m.msg_id,
                _cls: isAgent ? 'agent' : 'user',
                _text: m.content,
                _source: resolveName(m.from_agent),
                _to: resolveName(m.to_target),
                _raw: (m.from_agent || '?') + ' → ' + (m.to_target || '?'),
              });
            }
          });
          if (newMsgs.length > 0) {
            chatMessages.value = newMsgs.concat(chatMessages.value);
          }
          chatOffset.value += CHAT_PAGE;
          chatHasMore.value = items.length >= CHAT_PAGE;
          if (newMsgs.length > 0 && chatOffset.value <= CHAT_PAGE) scrollDown();
        }).catch(() => {});
    }

    function loadMoreShell() {
      if (!currentChat.value || !shellHasMore.value) return;
      if (!isAdmin.value) return;  // shell logs are admin-only
      const agentId = currentChat.value;
      fetch('/api/v1/messages?agent_id='+agentId+'&limit='+SHELL_PAGE+'&offset='+shellOffset.value)
        .then(r => r.json()).then(d => {
          const items = d.data || [];
          const existingIds = {};
          shellLogs.value.forEach(s => { existingIds[s._id] = true; });
          const newShells = [];
          items.forEach(m => {
            if (m.msg_type === 'shell_result' && !existingIds[m.msg_id]) {
              newShells.push({
                _id: m.msg_id,
                _time: m.timestamp ? new Date(m.timestamp).toLocaleTimeString() : '',
                _status: 'completed',
                _out: m.content || '',
              });
            }
          });
          if (newShells.length > 0) {
            shellLogs.value = newShells.concat(shellLogs.value);
          }
          shellOffset.value += SHELL_PAGE;
          shellHasMore.value = items.length >= SHELL_PAGE;
        }).catch(() => {});
    }

    function fetchLoopState() {
      if (!currentChat.value) return;
      fetch('/api/v1/agents/'+currentChat.value).then(r => r.json()).then(d => {
        if (d.code === 200 && d.data) {
          loopRunning.value = d.data.running || false;
          loopInterval.value = d.data.wakeup_interval || 10;
          loopIntervalInput.value = loopInterval.value;
        }
      }).catch(() => {});
      const agent = onlineAgents.value.find(a => a.agent_id === currentChat.value);
      if (agent && agent.port) {
        fetch('http://127.0.0.1:'+agent.port+'/api/state').then(r => r.json()).then(d => {
          if (d.code === 200 && d.data) {
            loopPaused.value = d.data.loop_paused || false;
            loopRunning.value = d.data.loop_running || false;
            loopInterval.value = d.data.wakeup_interval || 10;
          }
        }).catch(() => {});
      }
    }

    function loopStart() {
      if (!currentChat.value) return;
      fetch('/api/v1/agents/'+currentChat.value+'/loop/start',{method:'POST'})
        .then(r => r.json()).then(d => {
          if (d.code === 200) { loopRunning.value = true; loopPaused.value = false; }
        }).catch(() => {});
    }
    function loopPause() {
      if (!currentChat.value) return;
      fetch('/api/v1/agents/'+currentChat.value+'/loop/pause',{method:'POST'})
        .then(r => r.json()).then(d => {
          if (d.code === 200) loopPaused.value = true;
        }).catch(() => {});
    }
    function loopResume() {
      if (!currentChat.value) return;
      fetch('/api/v1/agents/'+currentChat.value+'/loop/resume',{method:'POST'})
        .then(r => r.json()).then(d => {
          if (d.code === 200) loopPaused.value = false;
        }).catch(() => {});
    }
    function loopSetInterval() {
      if (!currentChat.value) return;
      let sec = parseInt(loopIntervalInput.value) || 10;
      if (sec < 5) sec = 5;
      fetch('/api/v1/agents/'+currentChat.value+'/loop/interval?seconds='+sec,{method:'PUT'})
        .then(r => r.json()).then(d => {
          if (d.code === 200) loopInterval.value = sec;
        }).catch(() => {});
    }

    function sendMsg() {
      const text = inputMsg.value.trim();
      if (!text || !currentChat.value) return;
      inputMsg.value = '';
      const target = 'agent:' + currentChat.value;
      chatMessages.value.push({
        _id: Date.now(), _cls: 'user',
        _text: text, _source: myUserId.value.slice(5),
        _to: resolveName(target), _raw: myUserId.value + ' → ' + target,
      });
      scrollDown();
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({type:'chat_message',to:target,payload:{content:text,source:loginName.value.trim()}}));
      }

    }

    function clearChat() {
      chatMessages.value = [];
      shellLogs.value = [];
      chatOffset.value = 0;
      chatHasMore.value = true;
      shellOffset.value = 0;
      shellHasMore.value = true;
    }

    async function emergencyStop() {
      if (!confirm('确认触发全局紧急停止？')) return;
      await fetch('/api/v1/emergency-stop',{method:'POST'});
    }

    watch(currentChat, (newVal) => {
      if (newVal && ws && ws.readyState === 1) {
        ws.send(JSON.stringify({type:'subscribe',payload:{channel:'chat:agent:'+newVal}}));
      }
    });

    onMounted(() => {
      // 刷新恢复：登录态 + 当前聊天（sessionStorage 持久化，防"刷新后啥都看不到"）
      const savedName = sessionStorage.getItem('ahi_login_name');
      if (!savedName) return;
      loginName.value = savedName;
      myUserId.value = 'user:' + savedName;
      loggedIn.value = true;
      refreshAgents();
      refreshLogs();
      const savedChat = sessionStorage.getItem('ahi_current_chat');
      if (savedChat) {
        openChat(savedChat);
      }
      connectWs();
      if (!refreshAgentsTimer) refreshAgentsTimer = setInterval(refreshAgents, 5000);
      if (!refreshLogsTimer) refreshLogsTimer = setInterval(refreshLogs, 10000);
    });

    // agents 列表加载完成后，重新解析已渲染消息的显示名（刷新恢复时名字先降级为 id）
    watch(agents, () => {
      chatMessages.value.forEach(m => {
        if (m._raw) {
          const parts = m._raw.split(' → ');
          m._source = resolveName(parts[0]);
          m._to = resolveName(parts[1] || '');
        }
      });
    });
    onUnmounted(() => {
      clearTimeout(reconnectTimer);
      clearInterval(refreshAgentsTimer);
      clearInterval(refreshLogsTimer);
      document.removeEventListener('visibilitychange', onVisibilityChange);
      window.removeEventListener('online', onVisibilityChange);
      if (window.visualViewport) {
        window.visualViewport.removeEventListener('resize', adjustLayoutHeight);
        window.visualViewport.removeEventListener('scroll', adjustLayoutHeight);
      }
      if (ws) ws.close();
    });

    return {
      loggedIn, loginName, myUserId, isAdmin, sidebarOpen, doLogin,
      page, currentChat, inputMsg, wsConnected, agents, onlineAgents,
      logs, chatMessages, shellLogs, showShellLog, msgContainer,
      headerTitle, isOnline,
      openChat, sendMsg, clearChat, emergencyStop, navTo, navToChat,
      loopRunning, loopPaused, loopInterval, loopIntervalInput,
      loopStatusClass, loopStatusText,
      loopPause, loopResume, loopSetInterval, loopStart,
      renderMarkdown, resolveName,
      chatHasMore, loadMoreChat,
      shellHasMore, loadMoreShell,
    };
  }
}).mount('#app');
})();
</script>
</body>
</html>
